<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kazuki Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            min-height: 100vh;
        }

        /* LOADING */
        .loading {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.5s ease;
        }
        .loading.hide { opacity: 0; pointer-events: none; }
        .loading h1 { font-size: 2rem; color: #1565c0; margin-bottom: 30px; }
        .ring {
            width: 50px;
            height: 50px;
            border: 4px solid #90caf9;
            border-top-color: #1976d2;
            border-radius: 50%;
            animation: putar 0.8s linear infinite;
        }
        @keyframes putar { to { transform: rotate(360deg); } }
        .loading p { margin-top: 15px; color: #4296e7; font-size: 0.9rem; }

        /* KONTEN */
        .wrap { max-width: 400px; margin: 0 auto; padding: 20px; display: none; }
        .wrap.show { display: block; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .top-bar h2 { color: #0d47a1; font-size: 1.4rem; }
        .keluar {
            background: #90caf9;
            color: #0d47a1;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        .profil {
            background: white;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(13, 71, 161, 0.1);
            margin-bottom: 20px;
        }
        .profil img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #90caf9;
            margin-bottom: 15px;
        }
        .profil h3 { color: #0d47a1; font-size: 1.2rem; }
        .profil p { color: #5e92d3; font-size: 0.9rem; margin-top: 5px; }

        .card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 4px 15px rgba(13, 71, 161, 0.08);
            margin-bottom: 16px;
        }
        .produk { text-align: center; }
        .produk .ikon { font-size: 45px; margin-bottom: 8px; }
        .produk h4 { color: #0d47a1; font-size: 1rem; }
        .harga { font-size: 1.8rem; font-weight: 700; color: #1565c0; margin-top: 8px; }

        label { display: block; margin-bottom: 6px; color: #16509c; font-weight: 500; font-size: 0.9rem; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #bbdefb;
            border-radius: 10px;
            font-size: 0.95rem;
            margin-bottom: 14px;
            background: #f5faff;
        }
        input:focus { outline: none; border-color: #1976d2; }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2196f3, #1565c0);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .pesan {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 0.9rem;
        }
        .pesan.tampil { display: block; }
        .sukses { background: #e8f5e9; color: #2e7d32; }
        .gagal { background: #ffebee; color: #c62828; }
        .info { background: #e3f2fd; color: #1565c0; }

        a { color: #1976d2; text-decoration: none; font-weight: 500; }

        footer { text-align: center; margin-top: 30px; color: #5e92d3; font-size: 0.8rem; }
    </style>
</head>
<body>

    <!-- LOADING -->
    <div class="loading" id="layarLoading">
        <h1>✨ Kazuki Store</h1>
        <div class="ring"></div>
        <p>Memuat...</p>
    </div>

    <!-- KONTEN UTAMA -->
    <div class="wrap" id="kontenUtama">
        <div class="top-bar">
            <h2>✨ Kazuki Store</h2>
            <button class="keluar" onclick="keluar()">Keluar</button>
        </div>

        <div class="profil">
            <img src="https://c.termai.cc/i152/cQu5Lx.jpg" alt="Profil" 
                 onerror="this.src='https://via.placeholder.com/130/e3f2fd/1565c0?text=👤'">
            <h3>Kazuki Store</h3>
            <p>Belanja Mudah & Terpercaya</p>
        </div>

        <div class="card produk">
            <div class="ikon">🎁</div>
            <h4>Produk Pilihan</h4>
            <div class="harga">Rp 50.000</div>
        </div>

        <div class="card">
            <label>Nama Produk</label>
            <input type="text" id="namaProduk" value="Produk Kazuki Store">
            
            <label>Harga (Rp)</label>
            <input type="number" id="hargaProduk" value="50000">
            
            <label>Nama Pembeli</label>
            <input type="text" id="namaPembeli" placeholder="Masukkan nama kamu">
            
            <label>Email Pembeli</label>
            <input type="email" id="emailPembeli" placeholder="email@contoh.com">
            
            <button class="btn" id="btnBayar" onclick="buatPembayaran()">💳 Buat Pembayaran</button>
            <div class="pesan" id="kotakPesan"></div>
        </div>

        <footer>© 2026 Kazuki Store • Semua Hak Dilindungi</footer>
    </div>

    <script>
        // HILANGIN LOADING PASTI JALAN!
        window.onload = function() {
            setTimeout(function() {
                document.getElementById('layarLoading').classList.add('hide');
                document.getElementById('kontenUtama').classList.add('show');
            }, 1200);
        };

        function keluar() {
            if(confirm('Yakin mau keluar?')) location.reload();
        }

        function tampilPesan(jenis, teks) {
            const el = document.getElementById('kotakPesan');
            el.className = 'pesan tampil ' + jenis;
            el.innerHTML = teks;
        }

        async function buatPembayaran() {
            const btn = document.getElementById('btnBayar');
            const namaPembeli = document.getElementById('namaPembeli').value.trim();
            const emailPembeli = document.getElementById('emailPembeli').value.trim();
            const namaProduk = document.getElementById('namaProduk').value.trim();
            const harga = parseInt(document.getElementById('hargaProduk').value);

            if (!namaPembeli || !emailPembeli) {
                tampilPesan('gagal', '⚠️ Isi nama & email dulu!');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '⏳ Memproses...';
            tampilPesan('info', '⏳ Sedang membuat pesanan...');

            try {
                const res = await fetch('/api/create-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: harga,
                        productName: namaProduk,
                        buyerName: namaPembeli,
                        buyerEmail: emailPembeli
                    })
                });

                const data = await res.json();
                
                if (data.paymentUrl) {
                    tampilPesan('sukses', `✅ Berhasil! No. Pesanan: <strong>${data.merchantOrderId}</strong><br>
                    <a href="${data.paymentUrl}" target="_blank">👉 Klik di sini untuk membayar</a>`);
                } else {
                    tampilPesan('gagal', '❌ Gagal: ' + (data.error || 'Coba lagi nanti'));
                }
            } catch (err) {
                tampilPesan('gagal', '❌ Kesalahan jaringan. Coba lagi ya!');
            }

            btn.disabled = false;
            btn.innerHTML = '💳 Buat Pembayaran';
        }
    </script>
</body>
</html>
